[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install --production"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "nft"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/providers"
  to = "/.netlify/functions/providers"
  status = 200
